name: build-tipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装打包工具
        run: |
          brew install xcodegen ldid

      - name: 编译并打包 .tipa
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TrollGuard-tipa
          path: TrollGuard.tipa
          if-no-files-found: error
